# 一時ワークフロー（2026-09-08）＝Linux 用の package-lock.json を生成して artifact で持ち帰るためだけのもの。
# 🔴なぜ要るか＝Windows の npm は wasm32-wasi 等の optional 依存の**依存ツリーを解決しない**ので、
#   ローカルで作った lock には `@emnapi/runtime` が入らず、Linux の `npm ci` が
#   「Missing: @emnapi/runtime from lock file」で落ちる（2026-09-08 に実測）。
# ⚠取り込みが終わったらこのファイルは消す。
name: relock
on:
  workflow_dispatch:
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rm -f package-lock.json && npm install --package-lock-only
      - run: node -e "const l=require('./package-lock.json');console.log('emnapi:',Object.keys(l.packages).filter(k=>/emnapi/.test(k)).join(', '))"
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
