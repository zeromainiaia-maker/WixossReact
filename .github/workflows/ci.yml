name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 🔴**`npm install` にしない**＝caret 範囲（`^7.1.1` 等）を毎回解決し直すので、
      #   **コードを1行も変えていないのに CI が突然赤くなる**（2026-09-08 に実際に発生＝
      #   `eslint-plugin-react-hooks` が上がって `react-hooks/set-state-in-effect` が error になり、
      #   07:24 の run は緑・07:48 の run が赤。ローカルは 7.1.1 のままなので `npm run gates` は緑だった）。
      #   `npm ci` は `package-lock.json` のとおりに入れるので**再現性がある**。
      # ⚠`npm ci` は package.json と package-lock.json が同期していないと**ハード失敗**する
      #   ＝依存を足したら `npm install` をローカルで回して lock を必ず commit する。
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # ヘッドレス検証ハーネス（実機不要・数秒）。詳細は docs/P1_PLAN.md §7。
      - name: Golden (③正しさ・型＋トリガー収集の結果 assert)
        run: npm run golden

      - name: Smoke (②全効果10557件を自動実行しCRASH/HANG/INVARIANT検出)
        run: npm run smoke

      - name: Fuzz (②乱択 自己対戦・進化盤面で効果連鎖し相互作用/複製バグ検出)
        run: npm run fuzz
